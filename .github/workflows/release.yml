name: release

# Publishes a multi-arch image when the maintainer pushes a `v*` tag. Nothing is published on a
# normal push — `ci.yml` is what guards master. This workflow has never run: until a tag exists,
# there is no published image and the docs tell operators to build from source.
#
# The image is pushed only after the full `ci.yml` suite (static checks, unit + integration under
# coverage, build + e2e) passes on the tagged commit — a tag is not proof the commit was green.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    # Two architectures, one under QEMU emulation: slow, but not unbounded.
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is what an operator pulls without thinking, so a prerelease (`v1.2.0-rc.1`,
          # any tag with a semver `-` suffix) must never take it. The `major.minor` pattern already
          # skips prereleases on its own; `latest` is explicit so it needs the same rule spelled out.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # The Dockerfile's last stage; `builder` and `deps` are not shipped.
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
