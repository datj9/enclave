name: ci

on:
  # Every branch, not just the default one. Pinning this to a single branch name means the checks
  # silently never run on a repo whose default branch is called something else.
  push:
  pull_request:
  # release.yml calls this workflow so an image is only pushed from a tag that passes it.
  workflow_call:

# Read-only token for every job. Nothing here writes to the repository or a registry.
permissions:
  contents: read

# A newer push to the same branch makes the older run's result moot, so it is cancelled — except on
# the default branch, where every commit keeps its own record. `github.workflow` is the CALLER's
# name under `workflow_call`, so release.yml's run never shares (and cancels) this group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  # One place for the object-storage image. A dated release, never `latest`: the same commit must
  # test against the same server next month. From quay.io, MinIO's own registry — Docker Hub does
  # not carry the dated tags. The digest is the one `minio/minio:latest` resolved to when this was
  # pinned, so nothing changed underneath the tests. Keep in step with docker-compose.yml.
  MINIO_IMAGE: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e

# Actions are pinned to the commit a release tag pointed at when it was pinned (the trailing
# comment); a moved tag cannot change what runs. Dependabot keeps both in step.

jobs:
  static:
    name: typecheck, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No `version` input: the action reads `packageManager` from package.json, and pinning both
      # is a hard error the moment they drift ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cp .env.example .env

      - run: pnpm typecheck

      - run: pnpm lint

      # Reported, not enforced: the tree predates the check and ~120 files are not yet
      # Prettier-clean. Drop `continue-on-error` once a formatting-only commit lands.
      - run: pnpm format:check
        continue-on-error: true

  tests:
    name: unit + integration (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: enclave
          POSTGRES_PASSWORD: enclave
          POSTGRES_DB: enclave
        # 5434 on the runner, matching .env.example, so no config differs between CI and local.
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U enclave -d enclave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # MinIO is NOT a service container. A service container cannot override the image's command,
      # and the official minio image needs `server /data`; the bitnami image that starts on its own
      # no longer publishes a `latest` tag. It is started as a step below instead.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      # Same image, credentials and port as the `minio` profile in docker-compose.yml, so nothing
      # differs between CI and a local stack. tests/integration/** writes real bundles to it.
      - name: start minio
        run: &start-minio |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=enclave-dev-access-key \
            -e MINIO_ROOT_PASSWORD=enclave-dev-secret-key \
            "$MINIO_IMAGE" server /data
          for i in $(seq 1 40); do
            curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "minio did not become healthy" >&2
          docker logs minio >&2
          exit 1

      - run: pnpm install --frozen-lockfile

      - run: cp .env.example .env

      # Before the tests, not after: tests/integration/** queries the real schema.
      - run: pnpm db:migrate

      # Both vitest projects under coverage, with the thresholds in vitest.config.ts enforced.
      # CI=true (set by the runner) makes an unreachable Postgres or MinIO fail the integration
      # files rather than skip them — see tests/integration/require-services.ts.
      - run: pnpm test:coverage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: enclave
          POSTGRES_PASSWORD: enclave
          POSTGRES_DB: enclave
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U enclave -d enclave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: start minio
        run: *start-minio

      - run: pnpm install --frozen-lockfile

      - run: cp .env.example .env

      - run: pnpm db:migrate

      - run: pnpm build

      # The browser download is keyed on the exact Playwright version, so a lockfile bump misses
      # the cache instead of running a stale browser. The OS packages are not cacheable (they
      # live under /usr), so a hit still installs those.
      - id: playwright
        name: resolve playwright version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The image is otherwise only built by release.yml, at a tag, which is too late to learn the
  # Dockerfile broke. amd64 only (no QEMU): this proves the build and the runner's startup path,
  # not the second architecture.
  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: build runner
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: false
          load: true
          tags: enclave-runner:ci
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      # Not every revision of the Dockerfile has a `migrate` stage; build it when it exists.
      - id: stages
        name: detect migrate stage
        run: |
          if grep -qiE '^FROM[[:space:]].*[[:space:]]AS[[:space:]]+migrate[[:space:]]*$' Dockerfile; then
            echo "migrate=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Dockerfile has no migrate stage; not building it"
          fi

      - name: build migrate
        if: steps.stages.outputs.migrate == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate

      # The container's own first command, with the env the e2e job uses and no database: a valid
      # env must pass, and a missing secret must fail (proof the check really ran).
      - name: smoke-test the env preflight
        run: |
          docker run --rm --env-file .env.example enclave-runner:ci node scripts/check-env.ts
          if docker run --rm --env-file .env.example -e SESSION_SECRET= enclave-runner:ci \
            node scripts/check-env.ts; then
            echo "check-env.ts accepted an empty SESSION_SECRET" >&2
            exit 1
          fi

      # Loads @node-rs/argon2 the way server.js does: by the specifier the server chunks `require`
      # (Turbopack rewrites it to a hashed alias under .next/node_modules), resolved from the chunks
      # directory. A hash/verify round trip proves the linux native binding is in the image.
      - name: smoke-test the argon2 native binding
        run: |
          docker run --rm -i enclave-runner:ci node - <<'JS'
          const fs = require('node:fs')
          const path = require('node:path')
          const { createRequire } = require('node:module')
          const chunks = path.join(process.cwd(), '.next/server/chunks')
          const specifiers = new Set()
          for (const file of fs.readdirSync(chunks)) {
            if (!file.endsWith('.js')) continue
            const source = fs.readFileSync(path.join(chunks, file), 'utf8')
            for (const m of source.matchAll(/require\("(@node-rs\/argon2[^"]*)"\)/g)) specifiers.add(m[1])
          }
          if (specifiers.size === 0) throw new Error('no server chunk requires @node-rs/argon2')
          const load = createRequire(path.join(chunks, 'resolver.js'))
          ;(async () => {
            for (const specifier of specifiers) {
              const argon2 = load(specifier)
              const ok = await argon2.verify(await argon2.hash('smoke'), 'smoke')
              if (!ok) throw new Error(`${specifier}: hash/verify round trip failed`)
              console.log(`argon2 native binding ok via ${specifier}`)
            }
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          JS
