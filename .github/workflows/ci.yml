name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: enclave
          POSTGRES_PASSWORD: enclave
          POSTGRES_DB: enclave
        # 5434 on the runner, matching .env.example, so no config differs between CI and local.
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U enclave -d enclave"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cp .env.example .env

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm db:migrate

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
