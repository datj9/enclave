name: enclave

services:
  app:
    build:
      context: .
      target: runner
    image: enclave:local
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Overrides .env's host-side URL: inside the compose network Postgres answers on its
      # own service name and the container-internal port, not the published 5434.
      DATABASE_URL: postgresql://enclave:enclave@postgres:5432/enclave
      # Same split for object storage. `.env`'s S3_ENDPOINT is the host-side value that tests and
      # drizzle use; the container needs the service name. Unset means "use .env as-is", which is
      # what you want when S3_ENDPOINT already points at real S3, R2 or B2.
      S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL:-${S3_ENDPOINT}}
      # A presigned URL signs its own host and is followed by the *browser*, so it must be signed
      # with the endpoint the browser can resolve — not the compose-internal one above.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${S3_ENDPOINT}}
    depends_on:
      postgres:
        condition: service_healthy

  # Operator toolbox: migrations and the scheduled jobs under scripts/. The server image above
  # carries neither drizzle-kit nor the sources, so these run from the Dockerfile's `migrate`
  # target instead. Never started or rebuilt by `up`, and `run` reuses a stale image unless told
  # to rebuild, so pass --build after pulling a new version:
  #   docker compose run --rm --build tools                                # apply migrations
  #   docker compose run --rm tools pnpm exec tsx scripts/purge-trash.ts   # any job
  tools:
    build:
      context: .
      target: migrate
    image: enclave-tools:local
    profiles: ['tools']
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://enclave:enclave@postgres:5432/enclave
      S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL:-${S3_ENDPOINT}}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-${S3_ENDPOINT}}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      # 5434, not 5432 or 5433 — those collide with a locally installed Postgres and with
      # Docker Desktop on many machines.
      - '5434:5432'
    environment:
      POSTGRES_USER: enclave
      POSTGRES_PASSWORD: enclave
      POSTGRES_DB: enclave
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enclave -d enclave']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional zero-config object storage for a local demo:
  #   docker compose --profile minio up -d
  # Any S3-compatible backend works in production (AWS S3, GCS, R2, B2).
  minio:
    # Pinned by digest so a fresh `up` next month runs the server this was tested against. MinIO no
    # longer serves its images anonymously, so this is Chainguard's free build of the same server.
    # Keep in step with MINIO_IMAGE in .github/workflows/ci.yml.
    image: cgr.dev/chainguard/minio:latest@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    profiles: ['minio']
    # The image runs as uid 65532, but a fresh named volume is owned by root, so MinIO could not
    # write /data. This is a local demo service; production uses a real S3-compatible provider.
    user: '0:0'
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: enclave-dev-access-key
      MINIO_ROOT_PASSWORD: enclave-dev-secret-key
    volumes:
      - minio-data:/data
    # No healthcheck: the image ships neither `mc` nor `curl`, and nothing depends on this service
    # being healthy. Readiness is http://localhost:9000/minio/health/live, which
    # scripts/fresh-clone-demo.sh polls.

volumes:
  postgres-data:
  minio-data:
